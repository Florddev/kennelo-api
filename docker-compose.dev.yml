services:
  postgres:
    image: postgres:16-alpine
    container_name: kennelo-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: kennelo
      POSTGRES_PASSWORD: kennelo_dev_password
      POSTGRES_DB: kennelo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kennelo -d kennelo"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kennelo-redis-dev
    restart: unless-stopped
    command: redis-server --requirepass kennelo_dev_password
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--no-auth-warning", "-a", "kennelo_dev_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: kennelo-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: kennelo
      MINIO_ROOT_PASSWORD: kennelo_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: kennelo-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
    name: kennelo-postgres-dev-data
  redis-data:
    name: kennelo-redis-dev-data
  minio-data:
    name: kennelo-minio-dev-data