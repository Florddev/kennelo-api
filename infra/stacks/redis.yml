services:
  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "redis-server --requirepass \"$$(cat /run/secrets/kennelo_redis_password)\" --appendonly yes"]
    secrets:
      - kennelo_redis_password
    volumes:
      - kennelo-redis-data:/data
    networks:
      - kennelo-internal
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$(cat /run/secrets/kennelo_redis_password)\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kennelo-internal:
    external: true

volumes:
  kennelo-redis-data:

secrets:
  kennelo_redis_password:
    external: true
