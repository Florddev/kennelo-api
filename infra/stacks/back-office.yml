services:
  back-office:
    image: ghcr.io/anthony14fr/kennelo-back-office:${IMAGE_TAG}
    networks:
      - kennelo-public
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      replicas: ${BACK_OFFICE_REPLICAS}
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s

networks:
  kennelo-public:
    external: true
