services:
  api:
    image: ghcr.io/anthony14fr/kennelo-api:${IMAGE_TAG}
    environment:
      APP_NAME: Kennelo
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS}"

      APP_LOCALE: en
      APP_FALLBACK_LOCALE: en
      DOMAIN_LOCALES: "${DOMAIN_LOCALES}"
      DEFAULT_LOCALE: en
      AVAILABLE_LOCALES: "fr,en,it,de"

      LOG_CHANNEL: stack
      LOG_STACK: single
      LOG_LEVEL: warning

      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: kennelo
      DB_USERNAME: kennelo

      SESSION_DRIVER: redis
      SESSION_LIFETIME: "120"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_DB: "0"
      REDIS_CACHE_DB: "1"

      FILESYSTEM_DISK: s3
      MEDIA_DISK: s3
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: kennelo-media
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      AWS_URL: ${AWS_URL}

      JWT_ALGO: HS256
      JWT_TTL: "60"
      JWT_REFRESH_TOKEN_TTL: "43200"

      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: kennelo
      REVERB_APP_KEY: kennelo-key
      REVERB_HOST: ${REVERB_PUBLIC_HOST}
      REVERB_PORT: "443"
      REVERB_SCHEME: https

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}

      MAIL_MAILER: log
    secrets:
      - kennelo_app_key
      - kennelo_jwt_secret
      - kennelo_reverb_app_secret
      - kennelo_postgres_password
      - kennelo_redis_password
      - kennelo_minio_root_user
      - kennelo_minio_root_password
      - kennelo_google_client_secret
    networks:
      - kennelo-internal
      - kennelo-public
    deploy:
      replicas: ${API_REPLICAS}
      restart_policy:
        condition: any
      update_config:
        parallelism: 1
        delay: 10s

networks:
  kennelo-internal:
    external: true
  kennelo-public:
    external: true

secrets:
  kennelo_app_key:
    external: true
  kennelo_jwt_secret:
    external: true
  kennelo_reverb_app_secret:
    external: true
  kennelo_postgres_password:
    external: true
  kennelo_redis_password:
    external: true
  kennelo_minio_root_user:
    external: true
  kennelo_minio_root_password:
    external: true
  kennelo_google_client_secret:
    external: true
