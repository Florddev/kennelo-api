services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER_FILE: /run/secrets/kennelo_minio_root_user
      MINIO_ROOT_PASSWORD_FILE: /run/secrets/kennelo_minio_root_password
    secrets:
      - kennelo_minio_root_user
      - kennelo_minio_root_password
    volumes:
      - kennelo-minio-data:/data
    networks:
      - kennelo-internal
      - kennelo-public
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  kennelo-internal:
    external: true
  kennelo-public:
    external: true

volumes:
  kennelo-minio-data:

secrets:
  kennelo_minio_root_user:
    external: true
  kennelo_minio_root_password:
    external: true
