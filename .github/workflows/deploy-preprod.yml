name: Deploy - Preprod

on:
  workflow_run:
    workflows: ["Docker Images - CI"]
    types:
      - completed

concurrency:
  group: deploy-preprod
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to preprod
    runs-on: ubuntu-latest
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    steps:
      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_PREPROD }}

      - name: Add preprod host to known_hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST_PREPROD }} >> ~/.ssh/known_hosts

      - name: Deploy application code
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_PREPROD }} << 'REMOTE'
            set -euo pipefail
            cd ~/kennelo
            git fetch origin
            git checkout main
            git pull --ff-only
            echo "==> Déploiement applicatif préprod"
            ENV=preprod ./infra/scripts/deploy-app.sh
          REMOTE

      - name: Wait for rolling update to complete
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_PREPROD }} << 'REMOTE'
            set -euo pipefail
            for service in api_api web_web reverb_reverb back-office_back-office worker_worker; do
              state=""
              for i in $(seq 1 60); do
                state=$(docker service inspect "$service" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{else}}completed{{end}}')
                if [ "$state" = "completed" ]; then break; fi
                if [ "$state" = "paused" ] || [ "$state" = "rollback_completed" ]; then
                  echo "✗ $service : rolling update en état $state"
                  exit 1
                fi
                sleep 5
              done
              if [ "$state" != "completed" ]; then
                echo "✗ $service : rolling update toujours en cours après 5 minutes"
                exit 1
              fi
              echo "✓ $service à jour"
            done
          REMOTE

      - name: Run migrations
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST_PREPROD }} << 'REMOTE'
            set -euo pipefail
            cd ~/kennelo
            echo "==> Migrations préprod"
            ./infra/scripts/migrate.sh
          REMOTE

      - name: Health check
        run: |
          echo "==> Vérification santé préprod"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://preprod.kennelo.fr/api/health)
            if [ "$code" = "200" ]; then
              echo "✓ Préprod OK (HTTP $code)"
              exit 0
            fi
            echo "Tentative $i/5 : HTTP $code, retry dans 10s..."
            sleep 10
          done
          echo "✗ Préprod ne répond pas après 5 tentatives"
          exit 1
