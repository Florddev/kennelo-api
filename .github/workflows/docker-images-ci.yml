name: Docker Images - CI

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
    # Les filtres paths ne s'appliquent qu'aux pushes de branches :
    # un push de tag v*.*.* déclenche toujours le build, quels que
    # soient les fichiers touchés.
    paths:
      - 'api/**'
      - 'apps/web/**'
      - 'packages/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'infra/env/**'
      - 'infra/backup/**'
      - '.github/workflows/docker-images-ci.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: anthony14fr

jobs:
  build-api:
    name: Build API image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kennelo-api
          tags: |
            type=raw,value=preprod-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

  build-web:
    name: Build Web image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Les NEXT_PUBLIC_* sont figés au build (bundle client Next.js) :
      # une image web est donc construite PAR environnement. Push sur
      # main → URLs préprod, push de tag v*.*.* → URLs prod. Les URLs
      # sont dérivées de infra/env/<env>.env, source unique de vérité
      # partagée avec les scripts de déploiement.
      - name: Load web build config
        id: config
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            env_name=prod
          else
            env_name=preprod
          fi
          set -a
          source "infra/env/$env_name.env"
          set +a
          {
            echo "env_name=$env_name"
            echo "api_url=${APP_URL}/api"
            echo "reverb_auth_endpoint=${APP_URL}/broadcasting/auth"
            echo "reverb_host=${REVERB_PUBLIC_HOST}"
            echo "google_client_id=${NEXT_PUBLIC_GOOGLE_CLIENT_ID}"
          } >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kennelo-web
          tags: |
            type=raw,value=preprod-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push Web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/web/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.config.outputs.api_url }}
            NEXT_PUBLIC_ROUTE_MODE=dynamic
            NEXT_PUBLIC_REVERB_AUTH_ENDPOINT=${{ steps.config.outputs.reverb_auth_endpoint }}
            NEXT_PUBLIC_REVERB_APP_KEY=kennelo-key
            NEXT_PUBLIC_REVERB_HOST=${{ steps.config.outputs.reverb_host }}
            NEXT_PUBLIC_REVERB_PORT=443
            NEXT_PUBLIC_REVERB_SCHEME=https
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ steps.config.outputs.google_client_id }}

  build-back-office:
    name: Build Back-office image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Load back-office build config
        id: config
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            env_name=prod
          else
            env_name=preprod
          fi
          set -a
          source "infra/env/$env_name.env"
          set +a
          echo "api_url=${APP_URL}/api" >> "$GITHUB_OUTPUT"

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kennelo-back-office
          tags: |
            type=raw,value=preprod-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push Back-office image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/back-office/Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=back-office
          cache-to: type=gha,scope=back-office,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ steps.config.outputs.api_url }}

  build-backup:
    name: Build Backup image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/kennelo-backup
          tags: |
            type=raw,value=preprod-latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern=v{{version}}
            type=raw,value=prod,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-

      - name: Build and push Backup image
        uses: docker/build-push-action@v7
        with:
          context: infra/backup
          file: infra/backup/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backup
          cache-to: type=gha,scope=backup,mode=max
