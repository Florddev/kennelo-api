name: Retag Existing Images

# Workflow one-shot : lancé une seule fois lors de la bascule v0.1.0,
# pour retagger les images prod courantes (:main) en :v0.1.0 + :prod
# sans rebuild (docker buildx imagetools create copie le manifest, le
# binaire reste strictement identique à celui qui tourne en prod).
# À SUPPRIMER après usage.

on:
  workflow_dispatch:
    inputs:
      source_tag:
        description: 'Tag source existant sur GHCR'
        required: true
        default: 'main'
      target_tags:
        description: 'Tags cibles à créer, séparés par des virgules'
        required: true
        default: 'v0.1.0,prod'

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: anthony14fr

jobs:
  retag:
    name: Retag ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: [kennelo-api, kennelo-web]

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag image without rebuild
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAGS: ${{ inputs.target_tags }}
          IMAGE: ${{ matrix.image }}
        run: |
          source_ref="$REGISTRY/$IMAGE_OWNER/$IMAGE:$SOURCE_TAG"
          tag_args=()
          IFS=',' read -ra targets <<< "$TARGET_TAGS"
          for target in "${targets[@]}"; do
            target="$(echo "$target" | xargs)"
            [[ -n "$target" ]] && tag_args+=(--tag "$REGISTRY/$IMAGE_OWNER/$IMAGE:$target")
          done
          if [[ ${#tag_args[@]} -eq 0 ]]; then
            echo "Erreur : aucun tag cible valide dans '$TARGET_TAGS'." >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "$source_ref"

      - name: Verify created tags
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
          TARGET_TAGS: ${{ inputs.target_tags }}
          IMAGE: ${{ matrix.image }}
        run: |
          IFS=',' read -ra targets <<< "$TARGET_TAGS"
          for target in "${targets[@]}"; do
            target="$(echo "$target" | xargs)"
            [[ -n "$target" ]] || continue
            echo "==> $IMAGE:$target"
            docker buildx imagetools inspect "$REGISTRY/$IMAGE_OWNER/$IMAGE:$target"
          done
