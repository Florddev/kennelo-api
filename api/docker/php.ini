; Limites d'upload de l'image de production.
; Contrat applicatif : 8 Mo par image (règles Laravel max:8192), jusqu'à
; 15 images par requête — soit un corps pouvant atteindre 120 Mo.
; Hiérarchie voulue des refus : fichier trop lourd -> validation Laravel
; (422, message clair) ; corps trop gros -> nginx (413 net, voir
; client_max_body_size 128M). PHP ne doit JAMAIS être la couche qui refuse :
; son mode d'échec (troncature silencieuse au-delà de post_max_size) est
; opaque. D'où des valeurs strictement au-dessus des couches qui le
; précèdent : upload_max_filesize (10M) > la règle Laravel par fichier, et
; post_max_size (150M) > le client_max_body_size de nginx, rendant la zone
; de troncature inatteignable.
upload_max_filesize = 10M
post_max_size = 150M
